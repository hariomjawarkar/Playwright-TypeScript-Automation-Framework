name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update Visual Baselines'
        required: false
        default: false
        type: boolean
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: |
        if [[ "${{ github.event.inputs.update_snapshots }}" == "true" ]]; then
          npm run test:visual:update
        else
          npx playwright test
        fi

    - name: Commit and Push Snapshots (Manual Update Only)
      if: github.event.inputs.update_snapshots == 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "**/visual.spec.ts-snapshots/*.png"
        git commit -m "chore(visual): auto-update baseline snapshots [skip ci]" || echo "No changes to commit"
        git push
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
